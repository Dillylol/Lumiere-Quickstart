name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the Robot Controller app
        run: ./gradlew :TeamCode:assembleDebug --no-daemon
      - name: Run unit tests
        run: ./gradlew :TeamCode:testDebugUnitTest --no-daemon
